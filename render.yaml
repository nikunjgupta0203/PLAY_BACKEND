# Render Blueprint — PL4Y backend, STARTER plan ($7/month), Singapore.
#
# Region: Singapore, the closest Render region to our players (India). Keep
# Neon in the same region (aws-ap-southeast-1): every query is a round trip
# from the API to the database, and a cross-ocean hop costs ~200 ms each.
# Render cannot move a service between regions — a new region is a new service.
#
#   · the API and the worker run in ONE process (src/all.ts, `pnpm start:all`).
#     The worker is NOT optional — without it holds never expire, refunds never
#     run and notifications never send. One process keeps this to one $7
#     service; job work shares the CPU with requests, which is fine at today's
#     traffic.
#   · migrations run in the preDeployCommand (`pnpm db:deploy`): a failed
#     migration stops the deploy and the running version keeps serving.
#   · a starter service never sleeps, so no external pinger is needed.
#   · jobs, schedules and rate limits live in Postgres (the `jobs`,
#     `job_schedules` and `rate_limit_hits` tables), so a restart loses none
#     of them. There is no Redis.
#
# Scaling up: split `pl4y-api` into a web service running `pnpm start` and a
# `type: worker` service running `pnpm start:worker` (a second $7 service), so
# job work no longer competes with request latency (architecture.md §1).
#
# Postgres is Neon (ADR 0001), not Render: set DATABASE_URL (pooled) and
# DIRECT_DATABASE_URL (direct) in the `pl4y-shared` group after the first sync.
# Every `sync: false` value is asked for in the dashboard on first deploy.
#
# NODE_ENV=production is set at build time too, which makes pnpm skip
# devDependencies — hence `--prod=false`: the build needs tsc and prisma.

envVarGroups:
  - name: pl4y-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      # ── Database (Neon) ────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      # ── Auth — RS256 PEM pair, base64 or with literal \n ───────────────────
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CHECKIN_TOKEN_SECRET
        generateValue: true
      # ── Email — Resend ─────────────────────────────────────────────────────
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "PL4Y <support@getpl4y.com>"
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # ── Push — Expo ────────────────────────────────────────────────────────
      - key: PUSH_TRANSPORT
        value: expo
      # ── Realtime — Pusher ──────────────────────────────────────────────────
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        value: ap2
      # ── Media — Cloudinary ─────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false

services:
  - type: web
    name: pl4y-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    # Migrations run against DIRECT_DATABASE_URL after the build and before the
    # new version takes traffic; `migrate deploy` applies only what is new, so
    # a deploy with no new migration is a no-op.
    preDeployCommand: pnpm db:deploy
    startCommand: pnpm start:all
    healthCheckPath: /healthz
    envVars:
      - fromGroup: pl4y-shared
      # Comma-separated frontend origins. Empty means ANY origin is allowed.
      - key: CORS_ORIGINS
        sync: false
