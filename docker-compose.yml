# Local development only. Production Postgres is Neon (ADR 0001).
# PostGIS image, because events/venues/games all do radius search.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pl4y
      POSTGRES_PASSWORD: pl4y
      POSTGRES_DB: pl4y
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pl4y"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [pl4y_pg:/var/lib/postgresql/data]

volumes:
  pl4y_pg:
