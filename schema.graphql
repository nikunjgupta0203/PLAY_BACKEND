  reviewVenue(input: ReviewVenueInput!): VenueReviewPayload!

  """
  payouts R1 — saves (or replaces) the host bank details and starts the bank check. With `organisationId`, the organisation’s account instead: its owner only (org R6).
  """
  savePayoutAccount(
    accountNumber: String!

    """
    gap #25 — required when replacing details that were already verified. Ask with requestPayoutChangeCode.
    """
    emailCode: String
    ifsc: String!
    legalName: String!
    organisationId: ID
    pan: String!
  ): PayoutAccountPayload!

  """
  Runs the greedy scheduler over everything that is ready and unplaced (R11, R12). Also runs from a job whenever a match becomes ready.
  """
  scheduleDraw(tournamentId: ID!): ScheduleDrawPayload!
  selectOnboardingSports(input: SelectOnboardingSportsInput!): ProfilePayload!

  """Opens the conversation when there is none (chat R2, R3)."""
  sendMessage(input: SendMessageInput!): SendMessagePayload!
  setAvatar(publicId: String!): ProfilePayload!
  setContactPhone(phone: String): ViewerPayload!

  """bookings R4 — replaces a court’s weekly opening rules."""
  setCourtAvailability(courtId: ID!, rules: [CourtRuleInput!]!): VenueBookingSetupPayload!

  """
  F14 — when a match is played, with or without a court. Players get the 30-minute reminder. Null takes the time (and any court) off.
  """
  setMatchTime(matchId: ID!, startsAt: DateTime): MatchPayload!
  setNotificationPreferences(input: NotificationPreferencesInput!): PreferencesPayload!
  setProfileVisibility(visibility: ProfileVisibility!): ProfilePayload!
  setVenueBookingPolicy(input: VenueBookingPolicyInput!, venueId: ID!): VenueBookingSetupPayload!

  """
  bookings R7 — owners add desk or manager staff by email, or (role null) remove them.
  """
  setVenueStaff(email: String!, role: VenueRole, venueId: ID!): VenueStaffPayload!

  """
  F9 — PL4Y staff settle a dispute: KEEP the submitted result, or send the right one in `input`. Confirmed at once either way.
  """
  settleEscalatedResult(
    input: SubmitMatchResultInput
    keep: Boolean!
    matchId: ID!

    """portal R3 — kept in the audit log."""
    reason: String!
  ): MatchResultPayload!

  """
  gap #33 — PL4Y staff refund one entry by hand, up to what is left of its payment. Admin web only.
  """
  staffRefundRegistration(amountPaise: Int!, reason: String!, registrationId: ID!): StaffRefundPayload!

  """Opens the point log. Idempotent on a live match."""
  startMatch(firstServer: MatchSide, matchId: ID!): MatchPayload!
  submitMatchResult(input: SubmitMatchResultInput!): MatchResultPayload!
  suspendPayoutAccount(id: ID!, reason: String!): PayoutAccountPayload!

  """Takes a match off its court and back into the scheduler’s queue."""
  unassignCourt(matchId: ID!): MatchPayload!
  unblockPlayer(playerId: ID!): BlockPayload!

  """
  Takes back the heat’s last write — a mistyped mark, a wrong DNF, or a heat made final too soon. Carries expectedSeq like any write (scoring R1).
  """
  undoFieldEvent(expectedSeq: Int!, heatId: ID!): HeatPayload!

  """
  R2 — an appended event, never a delete. Takes back the last point standing.
  """
  undoPoint(input: UndoPointInput!): MatchPayload!

  """
  Sign-out calls this so the next user of the phone does not get this user’s pushes.
  """
  unregisterDevice(token: String!): RegisterDevicePayload!
  updateCourt(courtId: ID!, input: UpdateCourtInput!): CourtPayload!
  updateEvent(eventId: ID!, input: UpdateEventInput!): EventPayload!
  updateEventCategory(categoryId: ID!, input: UpdateEventCategoryInput!): EventCategoryPayload!

  """
  The owner or an admin: logo, description, city and contact. Not the name.
  """
  updateOrganisation(input: OrganisationDetailsInput!, organisationId: ID!): OrganisationPayload!
  updateProfileDetails(input: UpdateProfileDetailsInput!): ProfilePayload!
  updateProfileLocation(input: UpdateProfileLocationInput!): ProfilePayload!
  updateProfileSports(input: UpdateProfileSportsInput!): ProfilePayload!
  updateVenue(input: UpdateVenueInput!, venueId: ID!): VenuePayload!

  """
  bookings R6 — the venue cancels; everything is refunded, the platform fee too. Managers.
  """
  venueCancelCourtBooking(bookingId: ID!, reason: String!): CourtBookingPayload!

  """
  ADR 0003 §C2 — the client uploads straight to Cloudinary under this signature, then reports the public_id back through addVenuePhoto.
  """
  venuePhotoUploadSignature(venueId: ID!): MediaUploadPayload!
  verifyOtp(client: AuthClient = APP, code: String!, deviceLabel: String, email: String!): SessionPayload!
