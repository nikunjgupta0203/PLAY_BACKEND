  beginRegistration(input: BeginRegistrationInput!): RegistrationPayload!
  blockPlayer(playerId: ID!): BlockPayload!

  """
  bookings R6 — the player cancels; the refund follows the venue’s policy.
  """
  cancelCourtBooking(bookingId: ID!): CancelCourtBookingPayload!

