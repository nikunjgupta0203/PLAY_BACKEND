type LeagueRow {
  drawn: Int!
  lost: Int!
  place: Int!
  played: Int!
  points: Int!
  registration: Registration
  registrationId: ID!
  scoreAgainst: Int!

  """Goals, runs, points — whatever the scoreline counts."""
  scoreFor: Int!
  won: Int!
}

"""
payments R6 — one row per money movement. Signed: credits positive, debits negative. This, not the payments table, is what reconciles against a gateway settlement report.
"""
type LedgerEntry {
  amountPaise: Int!
  createdAt: DateTime!
  kind: String!
}

type ManagedVenue {
  role: VenueRole!
  venue: Venue!
}

type MarkReadPayload {
  unreadCount: Int!
  userError: UserError
}

type Match implements Node {
  bracket: BracketType!
  category: EventCategory
  completedAt: DateTime
  court: Court

  """Null until the match is started."""
  currentScore: ScoreState

  """
  The event this match belongs to — a match opened from a notification needs its timezone and a way back to the draw.
  """
  event: Event

  """Which group, from 1 — group-stage matches only."""
  group: Int
  id: ID!
  nodeId: ID!

  """Null until a result is submitted."""
  result: MatchResult

  """A knockout round, or a league or group matchday."""
  round: Int!

  """Advisory (tournament R13). Organizers move matches by hand."""
  scheduledAt: DateTime

  """
  Optimistic-concurrency handle for live scoring (scoring R1). Clients send it back with every point.
  """
  scoreSeq: Int!
  scoringRule: ScoringRule!

  """
  Null while the feeding match is still being played — or forever, on a bye.
  """
  sideA: Registration
  sideB: Registration

  """0-based, top of the bracket first."""
  slot: Int!
  status: MatchStatus!

  """
  Side A’s total on the scoreline (goals, runs, points) once a result is confirmed; what a table counts.
  """
  tallyA: Int
  tallyB: Int

  """A staff grant on the event, or a place in this match."""
  viewerCanScore: Boolean!

  """The side the viewer plays on, if they play in this match."""
  viewerSide: MatchSide

  """
  Who came out of this match. `scoring` records how it was won; this is the bracket’s own record that it was, because a final advances nobody.
  """
  winner: Registration
}

