"""The signed-in user."""
type Viewer {
  contactPhone: String
  createdAt: DateTime!
  displayName: String!
  email: String!

  """
  hosting R3, R4 — everything waiting on the viewer across their running events, most urgent first.
  """
  hostingNeedsYou: [HostingNeedsYouItem!]!
  id: ID!

  """hosting R1 — whether the app shows the Hosting tab."""
  isHosting: Boolean!

  """
  org R6 — the organisations the viewer belongs to, for “Host as” and the Hosting tab.
  """
  organisations: [OrganisationMembership!]!

  """
  admin, support or finance for PL4Y staff; null for everyone else. The admin portal reads it to decide what to show (portal R1).
  """
  platformRole: String
}

type ViewerPayload {
  userError: UserError
  viewer: Viewer
}

input WalkInBookingInput {
  courtId: ID!
  endsAt: DateTime!
  name: String!
  payment: WalkInPayment!
  phone: String
  startsAt: DateTime!
}

enum WalkInPayment {
  COMP
  OFFLINE
}
