type Mutation {
  acceptMessageRequest(conversationId: ID!): ConversationPayload!

  """
  Where the team becomes real, and therefore where a seat is taken — or, when the draw filled meanwhile, where the team joins the waitlist (R17).
  """
  acceptPartnerInvite(token: String!): RegistrationPayload!
  addCourt(input: CourtInput!, venueId: ID!): CourtPayload!
  addCourtBlackout(input: CourtBlackoutInput!): VenueBookingSetupPayload!
  addEventCategory(eventId: ID!, input: EventCategoryInput!): EventCategoryPayload!

  """
  F14 — a court the host has for this event ("Court 1"). The scheduler uses these first.
  """
  addEventCourt(eventId: ID!, name: String!): EventCourtPayload!

  """A Cloudinary public_id, never a URL (ADR 0003 §C3)."""
  addEventMedia(eventId: ID!, kind: EventMediaKind!, publicId: String!, sortOrder: Int): EventPayload!

  """
  Adds a helper to the event by their account email. The owner adds managers and scorers; a manager adds scorers. Scorers can check players in and score matches.
  """
  addEventStaff(email: String!, eventId: ID!, role: EventStaffRole!): EventStaffPayload!

  """
  Owner or manager. Seats a player who paid at the desk (OFFLINE) or plays free (COMP), until the draw is made. F20 — by account email, or by name with no account (a guest); a doubles walk-in names both players; a team walk-in names its captain, and optionally its name and teammates (N14). No money moves through PL4Y for it.
  """
  addOfflineRegistration(
    email: String
    eventCategoryId: ID!
    guestName: String
    mode: PaymentMode!
    partnerEmail: String
    partnerName: String

    """N14 — a team walk-in: the team’s name (optional)."""
    teamName: String

    """
    N14 — a team walk-in: the other players, each an account email or a name. Up to team size − 1.
    """
    teammates: [String!]
  ): RegistrationPayload!

  """
  The owner adds admins and members; an admin adds members. No account yet: they are emailed an invite.
  """
  addOrganisationMember(email: String!, organisationId: ID!, role: OrganisationAddableRole!): AddOrganisationMemberPayload!
  addVenuePhoto(
    """Never a URL (ADR 0003 §C3)."""
    publicId: String!
    venueId: ID!
  ): VenuePayload!
  adminAddOrganisationMember(email: String!, organisationId: ID!, reason: String!, role: OrganisationAddableRole!): AddOrganisationMemberPayload!

  """Take a ticket (assign it to yourself), or let it go (toMe false)."""
  adminAssignSupportTicket(ticketId: ID!, toMe: Boolean!): StaffSupportTicketPayload!
  adminCancelOrganisationInvite(inviteId: ID!, reason: String!): OrganisationOkPayload!

  """org R1 — created verified, with its owner (or an invite to them)."""
  adminCreateOrganisation(input: CreateOrganisationInput!, reason: String!): CreateOrganisationPayload!
  adminReinstateOrganisation(organisationId: ID!, reason: String!): OrganisationPayload!
  adminReinstateUser(reason: String!, userId: ID!): AdminUserPayload!
  adminRemoveOrganisationMember(organisationId: ID!, reason: String!, userId: ID!): OrganisationOkPayload!

  """
  admin R7 — answer a ticket (the person is told), or add an internal note (nobody is).
  """
  adminReplySupportTicket(body: String!, internal: Boolean!, ticketId: ID!): StaffSupportTicketPayload!
  adminResendOrganisationInvite(inviteId: ID!, reason: String!): OrganisationOkPayload!

  """
  admin R6 — close every open report on a target. Acting on a review keeps it hidden; dismissing shows it.
  """
  adminResolveModeration(outcome: ModerationStatus!, reason: String!, targetId: ID!, targetType: ReportTarget!): AdminClosedPayload!

  """
  15-admin R4 — a person’s full email and phone, for a reason that is audited.
  """
  adminRevealContact(reason: String!, userId: ID!): AdminContactPayload!

  """
  admin R8 — mark every open signal on a subject confirmed or dismissed. Suspending is a separate step.
  """
  adminReviewFraudCase(confirmed: Boolean!, reason: String!, subjectId: ID!, subjectType: FraudSubject!): AdminClosedPayload!

  """
  org R2 — the only way ownership moves. The previous owner stays on as an admin.
  """
  adminSetOrganisationOwner(email: String!, organisationId: ID!, reason: String!): CreateOrganisationPayload!

