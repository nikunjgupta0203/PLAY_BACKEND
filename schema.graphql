  adminSetPlatformRole(email: String, reason: String!, role: PlatformStaffRole, userId: ID): PlatformStaffPayload!
  adminSetSupportTicketStatus(status: SupportTicketStatus!, ticketId: ID!): StaffSupportTicketPayload!

