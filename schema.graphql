  cursor: String!
  node: MatchResultSummary!
}

enum MatchHistoryOutcome {
  FORFEIT
  PLAYED
  RETIRED
  WALKOVER
}

"""
scoring R10 — only PLAYED carries a point log, and only PLAYED moves a rating (rating R7).
"""
enum MatchOutcome {
  FORFEIT
  PLAYED
  RETIRED
  WALKOVER
}

type MatchPayload {
  match: Match
  userError: UserError
}

"""
HOW a match was won. It advances the bracket only once confirmed — by the other side, by a scorer who scored it, by an organizer 15 minutes later, or by itself at autoConfirmAt (scoring R6, R11, R12).
"""
type MatchResult {
  """
  When it confirms itself if nobody disputes it (R11). Null: a person must confirm it.
  """
  autoConfirmAt: DateTime
  confirmedAt: DateTime
  confirmedVia: ResultConfirmation
  disputeReason: String
  disputedAt: DateTime

  """Empty for a walkover (R10)."""
  games: [GameScore!]!

  """A league or group match that ended level."""
  isDraw: Boolean!

  """
  Qualifies the method — the shootout tally "4–3". Null without a method.
  """
  margin: String

  """
  How it was won beyond the scoreline: "shootout" today. Null for a win in normal play.
  """
  method: String
  outcome: MatchOutcome!

  """When an organizer may confirm on the other side’s behalf (R6)."""
  overrideOpensAt: DateTime!
  source: ResultSource!
  submittedAt: DateTime!
  viewerCanConfirm: Boolean!
  viewerCanDispute: Boolean!

  """Null for a draw."""
  winner: Registration
}

type MatchResultPayload {
  match: Match
  result: MatchResult
  userError: UserError
}

"""
profile R12 — one completed match from one player's side. Part of the competitive record, so it is visible on every profile (R5).
"""
type MatchResultSummary {
  completedAt: DateTime!
  event: Event

  """Empty for a walkover."""
  games: [PlayerGameScore!]!
  matchId: ID!
  opponents: [PlayerProfile!]!
  outcome: MatchHistoryOutcome!
  partners: [PlayerProfile!]!
  sport: Sport!
  won: Boolean!
}

"""A is `Match.sideA`, B is `Match.sideB`."""
enum MatchSide {
  A
  B
}

"""
WALKOVER is a result, not an absence: a bye is a real match row with one side (tournament R3). VOID is a Plate position nobody could ever reach.
"""
enum MatchStatus {
  AWAITING_CONFIRM
  COMPLETED
  LIVE
  READY
  SCHEDULED
  VOID
  WALKOVER
}

