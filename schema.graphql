  shootout: Shootout
  tiebreak: Boolean!
  winner: MatchSide
}

"""
The scoring family. RALLY: points within games (pickleball, badminton, table tennis, volleyball, squash). SETS: points within games within sets (tennis, padel). GOALS: a running score over periods (football, basketball, kabaddi). INNINGS: runs and wickets over a number of balls, one innings a side (cricket). SERIES: a race of units — frames, racks, games, maps (snooker, pool, billiards, carrom, chess, esports). BOUTS: rounds between two fighters, on judges’ cards or on points (boxing, MMA, wrestling, karate, taekwondo).
