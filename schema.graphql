  """The city the feed was built for: the argument, else the profile's."""
  city: String

  """
  Published events in the city, soonest first, excluding ones already entered.
  """
  featured: [Event!]!

  """home R6 — the viewer has never entered an event."""
  firstRun: Boolean!
  hero: HomeHero

  """home R5 — LIVE events the viewer has an entry in."""
  liveNow: [Event!]!

  """home R7 — null until the viewer has played a match in the sport."""
  stats: StatsSnapshot

  """
  home R4 — confirmed entries, soonest first, excluding the hero and live ones.
  """
  upcoming: [HomeEntry!]!
}

"""
home R3 — the viewer's next confirmed entry, or when there is none the city's headline event. `registration` is null for the headline case.
"""
